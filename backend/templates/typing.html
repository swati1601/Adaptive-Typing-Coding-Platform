{% extends "base.html" %}
{% block title %}Typing Practice - CodeArena{% endblock %}

{% block content %}

<div class="dashboard-container">

<div class="card" style="
max-width:1000px;
margin:30px auto;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
">

<h1 style="margin-bottom:10px;">
⌨️ Typing Practice
</h1>

<p style="color:#666;font-size:18px;">
Improve your typing speed and accuracy.
</p>

<!-- Stats -->

<div style="
display:flex;
gap:20px;
margin:30px 0;
flex-wrap:wrap;
">

<div style="
background:#2563eb;
color:white;
padding:15px 25px;
border-radius:12px;
font-size:18px;
font-weight:bold;
">
⏱ Timer :
<span id="timer">45</span>s
</div>

<div style="
background:#16a34a;
color:white;
padding:15px 25px;
border-radius:12px;
font-size:18px;
font-weight:bold;
">
⚡ WPM :
<span id="wpm">0</span>
</div>

<div style="
background:#dc2626;
color:white;
padding:15px 25px;
border-radius:12px;
font-size:18px;
font-weight:bold;
">
🎯 Accuracy :
<span id="accuracy">0</span>%
</div>

</div>

<!-- Level -->

<h3 style="margin-bottom:20px;">
Level :
<span id="level"
style="
background:#7c3aed;
color:white;
padding:5px 15px;
border-radius:20px;
">
easy
</span>
</h3>

<!-- Progress -->

<div style="
width:100%;
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-bottom:25px;
">

<div id="progress"
style="
height:100%;
width:0%;
background:#22c55e;
transition:.3s;
">
</div>

</div>

<!-- Typing Text -->

<div id="text"
style="
background:#1e293b;
color:#ffffff;
padding:25px;
border-radius:15px;
font-size:26px;
line-height:2;
font-family:monospace;
min-height:180px;
margin-bottom:25px;
">
Loading...
</div>

<!-- Typing Area -->

<textarea
id="input"
rows="7"
placeholder="Start typing here..."
style="
width:100%;
padding:20px;
font-size:22px;
font-family:monospace;
border-radius:12px;
border:3px solid #2563eb;
resize:none;
outline:none;
"
></textarea>

<br><br>

<div style="display:flex;gap:15px;">

<button
onclick="checkTyping()"
style="
padding:15px 35px;
background:#2563eb;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
">
Submit
</button>

<button
onclick="loadText()"
style="
padding:15px 35px;
background:#6b7280;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
">
Next Question
</button>

</div>

<h2
id="result"
style="
margin-top:25px;
font-size:28px;
font-weight:bold;
">
</h2>

</div>

</div>

<style>

.correct{
color:#22c55e;
font-weight:bold;
}

.current{
background:#facc15;
color:black;
padding:2px;
border-radius:4px;
}

.remaining{
color:white;
}

textarea:focus{

border-color:#16a34a;
box-shadow:0 0 10px rgba(22,163,74,.4);

}

button:hover{

transform:translateY(-2px);
transition:.2s;

}

</style>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='typing.js') }}"></script>
{% endblock %}
