<!doctype html>
<html>
  <head>
    <title>Coding Platform</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(to right, #0f172a, #1e293b);
        color: white;
        height: 100vh;
      }

      h1 {
        text-align: center;
        padding: 20px;
      }

      .main {
        display: flex;
        gap: 20px;
        padding: 20px;
        height: 85vh;
      }

      .questions {
        width: 25%;
        background: #111827;
        border-radius: 15px;
        padding: 15px;
        overflow-y: auto;
      }

      .question-item {
        background: #1e293b;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 10px;
        cursor: pointer;
      }

      .question-item:hover {
        background: #334155;
      }

      .editor {
        width: 50%;
        background: #111827;
        border-radius: 15px;
        padding: 20px;
      }

      .output {
        width: 25%;
        background: #111827;
        border-radius: 15px;
        padding: 20px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      select {
        padding: 10px;
        border: none;
        border-radius: 8px;
      }

      textarea {
        width: 100%;
        height: 350px;
        background: black;
        color: #22c55e;
        padding: 15px;
        border: none;
        border-radius: 10px;
        margin-top: 15px;
      }

      button {
        margin-top: 15px;
        padding: 12px 25px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      #questionTitle {
        font-size: 22px;
        color: #facc15;
      }

      #result {
        background: black;
        min-height: 120px;
        padding: 15px;
        border-radius: 10px;
        margin-top: 10px;
        color: #22c55e;
      }

      #error {
        margin-top: 10px;
        color: red;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>🚀 Coding Practice Platform</h1>

    <div class="main">
      <!-- LEFT PANEL -->
      <div class="questions">
        <h2>Questions</h2>
        <div id="questionsList"></div>
      </div>

      <!-- CENTER PANEL -->
      <div class="editor">
        <div class="top-bar">
          <select id="languageSelect" onchange="loadQuestions()">
            <option value="python">Python</option>
            <option value="c">C</option>
            <option value="java">Java</option>
          </select>

          <h3>
            Level:
            <span id="level">easy</span>
          </h3>
        </div>

        <div id="questionTitle">Select a Question</div>

        <textarea id="code" placeholder="Write code here..."></textarea>

        <button onclick="checkCode()">Run Code</button>
      </div>

      <!-- RIGHT PANEL -->
      <div class="output">
        <h2>Output</h2>

        <div id="result">Run code to see output...</div>

        <div id="error"></div>
      </div>
    </div>

    <script>
      let currentAnswer = "";

      function loadQuestions() {
        let lang = document.getElementById("languageSelect").value;

        fetch(`/all_questions?lang=${lang}&level=easy`)
          .then((res) => res.json())
          .then((data) => {
            let list = document.getElementById("questionsList");

            list.innerHTML = "";

            data.forEach((q, index) => {
              let item = document.createElement("div");

              item.className = "question-item";

              item.innerHTML = `<strong>Q${index + 1}</strong><br>${q.question}`;

              item.onclick = function () {
                document.getElementById("questionTitle").innerText = q.question;

                currentAnswer = q.answer;
              };

              list.appendChild(item);
            });
          })
          .catch((err) => {
            console.log(err);
          });
      }

      function checkCode() {
        let code = document.getElementById("code").value;

        fetch("/check_code", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            code: code,
            answer: currentAnswer,
          }),
        })
          .then((res) => res.json())

          .then((data) => {
            document.getElementById("result").innerHTML = data.result;

            document.getElementById("error").innerHTML = data.error || "";

            if (data.level) {
              document.getElementById("level").innerText = data.level;
            }
          });
      }

      loadQuestions();
    </script>
  </body>
</html>
