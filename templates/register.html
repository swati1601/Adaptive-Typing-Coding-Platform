{% extends "base.html" %}
{% block title %}Sign Up - CodeArena{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Join CodeArena</h1>
            <p>Create your account and start solving</p>
        </div>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register" class="auth-form" onsubmit="return validateRegister()">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="3" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password">
            </div>
            <div id="formError" class="alert alert-error" style="display:none;"></div>
            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</section>

<script>
function validateRegister() {
    const pw = document.getElementById('password').value;
    const cpw = document.getElementById('confirm_password').value;
    const err = document.getElementById('formError');
    if (pw !== cpw) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return false;
    }
    err.style.display = 'none';
    return true;
}
</script>
{% endblock %}
