<!doctype html>
<html>
<head>
  <title>Typing Test</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
    }

    #text {
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      font-size: 18px;
      text-align: left;
    }

    textarea {
      width: 100%;
      height: 100px;
      border-radius: 10px;
      border: none;
      padding: 10px;
      background: #020617;
      color: white;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    .correct { color: #22c55e; }
    .wrong { color: #4aef44; }

    .stats {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>⚡ Typing Test</h2>

  <h3>Level: <span id="level"></span></h3>

  <div id="text"></div>

  <textarea id="input" placeholder="Start typing..."></textarea><br>

  <button onclick="submitTyping()">Submit</button>

  <div class="stats">
    <p>Speed: <span id="speed">0</span> WPM</p>
    <p>Accuracy: <span id="accuracy">100</span>%</p>
    <p>Time: <span id="time">60</span>s</p>
  </div>

  <p id="result"></p>
</div>

<script>
let currentText = "";
let startTime;
let started = false;
let timeLeft = 60;
let timer;

// load text
function loadText() {
  fetch("/get_text")
    .then(res => res.json())
    .then(data => {
      currentText = data.text;
      document.getElementById("text").innerHTML = currentText;
      document.getElementById("level").innerText = data.level;

      document.getElementById("input").value = "";
      document.getElementById("speed").innerText = 0;
      document.getElementById("accuracy").innerText = 100;
      document.getElementById("time").innerText = 60;

      started = false;
      timeLeft = 60;
      clearInterval(timer);
    });
  }

    document.getElementById("input").addEventListener("input", function () {
  let typed = this.value;

  if (!started) {
    startTime = new Date();
    started = true;

    timer = setInterval(() => {
      if (timeLeft > 0) {
        timeLeft--;
        document.getElementById("time").innerText = timeLeft;
      } else {
        clearInterval(timer);
        this.disabled = true;
        alert("Time's up!");
      }
    }, 1000);
  }

  let display = "";

  for (let i = 0; i < currentText.length; i++) {
    if (typed[i] == null) {
      display += currentText[i];
    } else if (typed[i] === currentText[i]) {
      display += `<span class="correct">${currentText[i]}</span>`;
    } else {
      display += `<span class="wrong">${currentText[i]}</span>`;
    }
  }

  document.getElementById("text").innerHTML = display;

  // Speed
  let now = new Date();
  let timeDiff = (now - startTime) / 1000 / 60;
  let words = typed.length / 5;
  let speed = Math.round(words / timeDiff);
  document.getElementById("speed").innerText = speed || 0;
});
function submitTyping() {
  let typed = document.getElementById("input").value;

  let correct = 0;
  let minLength = Math.min(typed.length, currentText.length);

  for (let i = 0; i < minLength; i++) {
    if (typed[i] === currentText[i]) correct++;
  }

  let accuracy = (correct / currentText.length) * 100;
  document.getElementById("accuracy").innerText = accuracy.toFixed(2);

  fetch("/update_typing", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ accuracy: accuracy })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("result").innerText =
      "Level: " + data.level;

    setTimeout(loadText, 1000);
  });
}

loadText();
</script>

</body>
</html>
